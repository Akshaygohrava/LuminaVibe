spring.application.name=luminavibe

# Dynamic port for Render (falls back to 8080 locally)
server.port=${PORT:8080}

# PostgreSQL Datasource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/luminavibe}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Settings
spring.app.jwtSecret=${SPRING_APP_JWT_SECRET:jfdjfhjdhfjdhfjdhfdjhfjhgrjirutirirutirjifjirhitgthythyyuhtyfghhhjjjhtdgyfrthtyutyt}
spring.app.jwtExpirationMs=${SPRING_APP_JWT_EXPIRATION_MS:432000000}
