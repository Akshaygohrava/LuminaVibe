spring.application.name=luminavibe

# Dynamic port for Render (falls back to 8080 locally)
server.port=${PORT:8080}

# Reverse proxy support for Render
server.forward-headers-strategy=framework

# Base URL for uploaded media files
app.base-url=${APP_BASE_URL:https://luminavibe-backend.onrender.com}

# Multipart upload limits (allow high-resolution photos and videos)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# PostgreSQL Datasource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/luminavibe}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Settings
spring.app.jwtSecret=${SPRING_APP_JWT_SECRET:jfdjfhjdhfjdhfjdhfdjhfjhgrjirutirirutirjifjirhitgthythyyuhtyfghhhjjjhtdgyfrthtyutyt}
spring.app.jwtExpirationMs=${SPRING_APP_JWT_EXPIRATION_MS:432000000}
